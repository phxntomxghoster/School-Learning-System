<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion Engine - Core OS</title>
    <style>
        /* =========================================================
           1. CORE VARIABLES & GLASSMORPHISM
           ========================================================= */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --xbox-accent: #107C10;
            --xbox-glow: rgba(16, 124, 16, 0.8);
            --text-main: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050505; color: var(--text-main); }

        /* Ultimate Liquid Glass Utility */
        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            box-shadow: 0 25px 45px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* =========================================================
           2. DYNAMIC BACKGROUND ENGINE
           ========================================================= */
        #bg-layer {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; z-index: -1;
            background-size: 400% 400%; transition: opacity 0.5s ease;
        }

        /* Theme 1: Liquid Flow (macOS vibe) */
        .theme-liquid {
            background: linear-gradient(45deg, #0a0a1a, #1a1a3a, #001f3f, #0a0a1a);
            animation: bgFlow 20s ease infinite; filter: blur(80px);
        }

        /* Theme 2: Midnight Console (Xbox vibe) */
        .theme-midnight {
            background: radial-gradient(circle at 50% 50%, #151515, #050505 80%);
            filter: blur(20px);
        }

        /* Theme 3: Cyber Grid */
        .theme-cyber {
            background: linear-gradient(135deg, #2b00ff, #ff007f, #000000);
            animation: bgFlow 15s ease infinite; filter: blur(60px);
        }

        /* Theme 4: Cursed Energy */
        .theme-cursed {
            background: radial-gradient(circle at 50% 100%, #4a00e0, #8e2de2, #000000 70%);
            animation: bgPulse 8s alternate infinite; filter: blur(90px);
        }

        @keyframes bgFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes bgPulse { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 1; transform: scale(1.05); } }

        /* =========================================================
           3. XBOX DASHBOARD LAYOUT
           ========================================================= */
        #os-wrapper { display: flex; height: 100vh; width: 100vw; padding: 30px; gap: 30px; }

        /* Side Guide */
        .xbox-guide { width: 280px; border-radius: 24px; padding: 30px 20px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .guide-header { font-size: 24px; font-weight: 800; letter-spacing: 1px; margin-bottom: 20px; text-align: center; color: #fff; text-shadow: 0 0 15px var(--glass-highlight); }
        
        .guide-tab { 
            padding: 15px 20px; border-radius: 16px; font-size: 16px; font-weight: 600; 
            cursor: pointer; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            display: flex; align-items: center; gap: 12px; 
        }
        .guide-tab:hover { background: rgba(255,255,255,0.1); transform: translateX(5px); }
        .guide-tab.active { background: var(--xbox-accent); border: 1px solid var(--xbox-glow); box-shadow: 0 0 20px rgba(16, 124, 16, 0.4); }

        /* Main Stage Area */
        .main-stage { flex: 1; border-radius: 24px; padding: 40px; position: relative; overflow: hidden; z-index: 10; }
        .stage-title { font-size: 28px; font-weight: 700; margin-bottom: 30px; letter-spacing: 0.5px; }

        /* Views */
        .view-section { display: none; height: 100%; flex-direction: column; animation: fadeIn 0.3s ease-out; }
        .view-section.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Game Grid (Empty for now) */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; width: 100%; overflow-y: auto; padding-right: 10px; flex: 1; }
        .game-grid::-webkit-scrollbar { display: none; }

        .game-tile {
            height: 220px; border-radius: 20px; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
            cursor: pointer; position: relative; overflow: hidden; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
        }
        .game-tile::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 20px; border: 3px solid transparent; transition: 0.3s; pointer-events: none; }
        .game-tile:hover { transform: scale(1.05) translateY(-8px); background: rgba(255,255,255,0.1); z-index: 10; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .game-tile:hover::after { border-color: var(--xbox-accent); box-shadow: inset 0 0 20px var(--xbox-glow); }
        
        .game-icon { font-size: 50px; position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); transition: 0.3s; }
        .game-tile:hover .game-icon { transform: translate(-50%, -60%) scale(1.1); }
        .game-name { font-size: 18px; font-weight: 700; z-index: 2; }
        .game-status { font-size: 12px; opacity: 0.7; z-index: 2; margin-top: 5px; }

        /* Settings UI */
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .theme-btn {
            background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); padding: 20px; border-radius: 16px;
            color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .theme-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--xbox-accent); transform: scale(1.02); }
        .theme-preview { width: 100%; height: 60px; border-radius: 8px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.2); }

        /* =========================================================
           4. GAME RUNNER OVERLAY
           ========================================================= */
        #game-runner {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999;
            display: none; flex-direction: column; animation: runnerOpen 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes runnerOpen { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .runner-header { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(20,20,20,0.9); border-bottom: 1px solid var(--glass-border); }
        .xbox-home-btn { 
            background: var(--xbox-accent); border: none; border-radius: 50%; width: 30px; height: 30px; 
            color: #fff; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px var(--xbox-glow); transition: 0.2s;
        }
        .xbox-home-btn:hover { transform: scale(1.1); filter: brightness(1.2); }
        #game-container { flex: 1; width: 100%; height: 100%; position: relative; background: #111; }
    </style>
</head>
<body>

    <!-- Dynamic Background Layer -->
    <div id="bg-layer" class="theme-liquid"></div>

    <div id="os-wrapper">
        <!-- XBOX GUIDE -->
        <nav class="xbox-guide liquid-glass">
            <div class="guide-header">🌌 ORION</div>
            <div class="guide-tab active" onclick="switchView('games', this)">🎮 My Games</div>
            <div class="guide-tab" onclick="switchView('settings', this)">⚙️ Settings</div>
            
            <div style="margin-top: auto; font-size: 12px; opacity: 0.5; text-align: center;">
                Core OS v3.0<br>Securly Bypass Active
            </div>
        </nav>

        <!-- MAIN STAGE -->
        <main class="main-stage liquid-glass">
            
            <!-- VIEW: GAMES -->
            <div id="view-games" class="view-section active">
                <div class="stage-title">Ready to Play</div>
                <div class="game-grid" id="game-grid">
                    <!-- Engine dynamically injects tiles here -->
                </div>
            </div>

            <!-- VIEW: SETTINGS -->
            <div id="view-settings" class="view-section">
                <div class="stage-title">System Configuration</div>
                <h3 style="margin-bottom: 15px; opacity: 0.8; font-size: 16px;">Display Theme</h3>
                
                <div class="settings-grid">
                    <button class="theme-btn" onclick="setTheme('theme-liquid')">
                        <div class="theme-preview theme-liquid"></div>
                        Liquid Flow
                    </button>
                    <button class="theme-btn" onclick="setTheme('theme-midnight')">
                        <div class="theme-preview theme-midnight"></div>
                        Midnight Console
                    </button>
                    <button class="theme-btn" onclick="setTheme('theme-cyber')">
                        <div class="theme-preview theme-cyber"></div>
                        Cyber Grid
                    </button>
                    <button class="theme-btn" onclick="setTheme('theme-cursed')">
                        <div class="theme-preview theme-cursed"></div>
                        Cursed Energy
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- GAME RUNNER OVERLAY -->
    <div id="game-runner">
        <div class="runner-header">
            <div style="font-weight: 700; letter-spacing: 1px;" id="runner-title">Running...</div>
            <button class="xbox-home-btn" onclick="OrionEngine.closeGame()">X</button>
        </div>
        <div id="game-container"></div>
    </div>

    <script>
        /* =========================================================
           UI LOGIC & SETTINGS
           ========================================================= */
        
        // Tab Switching Logic
        function switchView(viewId, tabElement) {
            // Update Tab Styling
            document.querySelectorAll('.guide-tab').forEach(t => t.classList.remove('active'));
            tabElement.classList.add('active');

            // Update View Visibility
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
        }

        // Theme Engine with Local Storage Backup
        function setTheme(themeClass) {
            const bgLayer = document.getElementById('bg-layer');
            bgLayer.className = ''; // Clear current
            bgLayer.classList.add(themeClass);
            localStorage.setItem('orion_theme', themeClass); // Save for next reload
        }

        // Load saved theme on boot
        window.onload = () => {
            const savedTheme = localStorage.getItem('orion_theme');
            if (savedTheme) {
                setTheme(savedTheme);
            }
        };

        // Stealth Protocol (Alt + S)
        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key.toLowerCase() === 's') {
                document.body.innerHTML = '<h1 style="color:black; background:white; height:100vh; padding:20px; font-family:sans-serif;">Biology 101 - Cell Structures</h1>';
            }
        });

        /* =========================================================
           ORION ENGINE (READY FOR FUTURE GAME INJECTIONS)
           ========================================================= */
        window.OrionEngine = {
            library: [], // Games go here later

            registerApp: function(config) {
                this.library.push(config);
                this.renderGrid();
            },

            renderGrid: function() {
                const grid = document.getElementById('game-grid');
                grid.innerHTML = ''; 

                this.library.forEach((app, index) => {
                    const tile = document.createElement('div');
                    tile.className = 'game-tile liquid-glass';
                    tile.innerHTML = `
                        <div class="game-icon">${app.icon}</div>
                        <div class="game-name">${app.name}</div>
                        <div class="game-status">${app.type || 'Local Module'}</div>
                    `;
                    tile.onclick = () => this.launchGame(index);
                    grid.appendChild(tile);
                });
            },

            launchGame: function(index) {
                const app = this.library[index];
                document.getElementById('runner-title').innerText = app.name;
                document.getElementById('game-runner').style.display = 'flex';
                
                const container = document.getElementById('game-container');
                container.innerHTML = ''; 
                if (typeof app.init === 'function') app.init(container);
            },

            closeGame: function() {
                document.getElementById('game-runner').style.display = 'none';
                document.getElementById('game-container').innerHTML = ''; 
            }
        };

        // Ready for you to drop your custom game code!
        // Just call OrionEngine.registerApp({ ... }) when you have them.
    </script>
</body>
</html>
