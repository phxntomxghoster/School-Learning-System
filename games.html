<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Core // Pro</title>
    <style>
        /* --- PS5 PRO THEME VARIABLES --- */
        :root {
            --ps-dark: #0b0c10;
            --ps-blue: #2e6bf5;
            --ps-light-blue: #6aa1fa;
            --ps-gold: #d4af37;
            --text-main: #f5f5f7;
            --text-muted: #8b8f98;
            --glass-bg: rgba(25, 25, 30, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        body { background: var(--ps-dark); color: var(--text-main); height: 100vh; overflow: hidden; transition: background 0.5s ease; }

        /* --- BACKGROUND DYNAMIC GLOW --- */
        #dynamic-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 30%, rgba(46, 107, 245, 0.15) 0%, var(--ps-dark) 70%);
            z-index: -1; transition: all 0.8s ease;
        }

        /* --- 1. BOOT SEQUENCE (PRO EXTENDED) --- */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000;
            z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.2s ease-in-out;
        }
        
        .ps-spark {
            width: 2px; height: 2px; border-radius: 50%; background: #fff;
            box-shadow: 0 0 50px 20px rgba(106, 161, 250, 0), 0 0 100px 50px rgba(46, 107, 245, 0);
            animation: spark-ignite 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        
        .boot-logo {
            position: absolute; font-size: 2.5rem; font-weight: 300; letter-spacing: 10px; color: #fff;
            opacity: 0; transform: scale(0.9); animation: logo-reveal 4s 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .boot-logo span { font-weight: 700; color: var(--ps-light-blue); }

        @keyframes spark-ignite {
            0% { box-shadow: 0 0 10px 2px rgba(106, 161, 250, 0); opacity: 0; }
            30% { box-shadow: 0 0 100px 40px rgba(106, 161, 250, 0.8), 0 0 200px 100px rgba(46, 107, 245, 0.6); opacity: 1; transform: scale(1.5); }
            100% { box-shadow: 0 0 200vw 200vh rgba(46, 107, 245, 0.1); opacity: 0; transform: scale(3); }
        }
        @keyframes logo-reveal {
            0% { opacity: 0; transform: scale(0.95); filter: blur(10px); }
            50% { opacity: 1; transform: scale(1); filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.05); filter: blur(5px); }
        }

        /* --- 2. USER SELECTION SCREEN --- */
        #user-select {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99990;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.8s ease;
        }
        .user-title { font-size: 1.5rem; font-weight: 300; margin-bottom: 40px; letter-spacing: 2px; }
        
        .profile-card {
            display: flex; flex-direction: column; align-items: center; gap: 15px; cursor: pointer;
            padding: 20px; border-radius: 12px; transition: all 0.3s ease;
        }
        .profile-card:hover .avatar-circle { transform: translateY(-5px); box-shadow: 0 0 25px rgba(255,255,255,0.4); border-color: #fff; }
        .profile-card:hover .profile-name { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        .avatar-circle {
            width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, var(--ps-blue), #111);
            border: 3px solid transparent; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
            font-size: 3rem; color: rgba(255,255,255,0.8);
        }
        .profile-name { font-size: 1.2rem; font-weight: 500; color: var(--text-muted); transition: all 0.3s; }

        /* --- 3. PS5 PRO DASHBOARD --- */
        #dashboard { display: none; flex-direction: column; height: 100vh; padding: 40px; opacity: 0; transition: opacity 1s ease; }
        
        /* Top Navigation Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-item { 
            font-size: 1.2rem; font-weight: 500; color: var(--text-muted); cursor: pointer; 
            padding-bottom: 5px; transition: all 0.2s; position: relative;
        }
        .nav-item:hover, .nav-item.active { color: #fff; }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; 
            background: #fff; box-shadow: 0 0 10px #fff;
        }
        
        /* Top Right System Icons */
        .sys-icons { display: flex; align-items: center; gap: 20px; font-size: 1.1rem; color: var(--text-main); }
        .sys-avatar { width: 35px; height: 35px; border-radius: 50%; background: var(--ps-blue); border: 2px solid #fff; }

        /* Horizontal Game/App Grid */
        .content-row { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; scrollbar-width: none; }
        .content-row::-webkit-scrollbar { display: none; }
        
        .app-tile {
            min-width: 150px; height: 150px; border-radius: 20px; background: var(--glass-bg);
            backdrop-filter: blur(15px); border: 1px solid var(--glass-border); display: flex;
            flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .app-tile:hover {
            transform: scale(1.1) translateY(-10px);
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 20px rgba(106, 161, 250, 0.2);
            z-index: 10; background: rgba(40, 40, 50, 0.6);
        }
        .app-icon { font-size: 3rem; margin-bottom: 10px; }
        .app-title { font-size: 0.9rem; font-weight: 500; opacity: 0; transition: opacity 0.3s; }
        .app-tile:hover .app-title { opacity: 1; }

        /* Detail Panel (Bottom) */
        .detail-panel {
            margin-top: 40px; padding: 30px; border-radius: 15px; background: linear-gradient(to right, rgba(0,0,0,0.6), transparent);
            max-width: 600px; opacity: 0; transform: translateY(20px); transition: all 0.4s ease;
        }
        .detail-panel.visible { opacity: 1; transform: translateY(0); }
        .detail-title { font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        .detail-desc { font-size: 1rem; color: var(--text-muted); line-height: 1.5; }
        .play-btn { 
            margin-top: 20px; padding: 12px 40px; background: #fff; color: #000; border: none; 
            border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: all 0.2s;
        }
        .play-btn:hover { background: var(--ps-light-blue); color: #fff; box-shadow: 0 0 15px var(--ps-blue); }

        /* --- GOOGLE CLASSROOM PANIC MASK --- */
        #panic-mask {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; z-index: 999999;
            display: none; font-family: Arial, sans-serif; color: #202124; padding: 40px;
        }
    </style>
</head>
<body>

    <div id="dynamic-bg"></div>

    <!-- 1. BOOT SCREEN -->
    <div id="boot-screen">
        <div class="ps-spark"></div>
        <div class="boot-logo">PHANTOM <span>PRO</span></div>
    </div>

    <!-- 2. USER SELECTION -->
    <div id="user-select">
        <div class="user-title">Welcome Back to Phantom Core</div>
        <div class="profile-card" onclick="loginToDashboard()">
            <div class="avatar-circle">P</div>
            <div class="profile-name">phxntom</div>
        </div>
    </div>

    <!-- 3. MAIN DASHBOARD -->
    <div id="dashboard">
        <div class="top-bar">
            <div class="nav-links">
                <div class="nav-item active">Games</div>
                <div class="nav-item">Chat Mesh</div>
                <div class="nav-item">AI Core</div>
                <div class="nav-item">Admin</div>
            </div>
            <div class="sys-icons">
                <span id="clock">12:00 PM</span>
                <span>⚙️</span>
                <div class="sys-avatar"></div>
            </div>
        </div>

        <div class="content-row">
            <div class="app-tile" onmouseover="showDetails('SAO: Fatal Bullet', 'Dive back into GGO. Last played: Yesterday.', '#e3342f')" onmouseout="hideDetails()">
                <div class="app-icon">⚔️</div>
                <div class="app-title">Sword Art Online</div>
            </div>
            <div class="app-tile" onmouseover="showDetails('JJK: Cursed Clash', 'Domain Expansion ready. 4 friends online.', '#6f42c1')" onmouseout="hideDetails()">
                <div class="app-icon">🤞</div>
                <div class="app-title">Jujutsu Kaisen</div>
            </div>
            <div class="app-tile" onmouseover="showDetails('Phantom Terminal', 'Developer override active. Access backend systems.', '#00ffcc')" onmouseout="hideDetails()">
                <div class="app-icon">💻</div>
                <div class="app-title">Terminal</div>
            </div>
            <div class="app-tile" onmouseover="showDetails('Discord Node', '3 unread messages in #coding. Stay connected.', '#5865F2')" onmouseout="hideDetails()">
                <div class="app-icon">💬</div>
                <div class="app-title">Channels</div>
            </div>
        </div>

        <div class="detail-panel" id="detail-panel">
            <div class="detail-title" id="d-title">Game Title</div>
            <div class="detail-desc" id="d-desc">Game description goes here.</div>
            <button class="play-btn">Launch</button>
        </div>
    </div>

    <!-- PANIC MASK -->
    <div id="panic-mask">
        <h1 style="color:#202124; margin-bottom:10px;">Google Classroom</h1>
        <p style="color:#5f6368;">No active assignments due. Check back later.</p>
    </div>

    <script>
        // BOOT LOGIC
        setTimeout(() => {
            const boot = document.getElementById('boot-screen');
            boot.style.opacity = '0';
            setTimeout(() => {
                boot.style.display = 'none';
                showUserSelect();
            }, 1200);
        }, 5500); // Wait for the spark and logo animations

        function showUserSelect() {
            const userScreen = document.getElementById('user-select');
            userScreen.style.display = 'flex';
            setTimeout(() => userScreen.style.opacity = '1', 100);
        }

        function loginToDashboard() {
            const userScreen = document.getElementById('user-select');
            userScreen.style.opacity = '0';
            
            setTimeout(() => {
                userScreen.style.display = 'none';
                const dash = document.getElementById('dashboard');
                dash.style.display = 'flex';
                setTimeout(() => dash.style.opacity = '1', 100);
            }, 800);
        }

        // DYNAMIC UI HOVER EFFECTS
        function showDetails(title, desc, color) {
            document.getElementById('d-title').innerText = title;
            document.getElementById('d-desc').innerText = desc;
            
            const panel = document.getElementById('detail-panel');
            panel.classList.add('visible');
            
            // Shift background color slightly based on hovered item (PS5 style)
            document.getElementById('dynamic-bg').style.background = `radial-gradient(circle at 50% 30%, ${color} 0%, var(--ps-dark) 70%)`;
        }

        function hideDetails() {
            document.getElementById('detail-panel').classList.remove('visible');
            document.getElementById('dynamic-bg').style.background = `radial-gradient(circle at 50% 30%, rgba(46, 107, 245, 0.15) 0%, var(--ps-dark) 70%)`;
        }

        // LIVE CLOCK
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        // PANIC KEY
        window.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                const mask = document.getElementById('panic-mask');
                mask.style.display = mask.style.display === 'block' ? 'none' : 'block';
            }
        });
    </script>
</body>
</html>
