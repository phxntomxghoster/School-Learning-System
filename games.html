<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega-Million Games Hub V2</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --surface-hover: #27272a;
            --accent: #8b5cf6;
            --text: #fafafa;
            --text-muted: #a1a1aa;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background: var(--surface);
            padding: 30px 0;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
        }

        h1 {
            margin: 0;
            color: var(--text);
            font-size: 3rem;
            letter-spacing: -1px;
        }

        h1 span {
            color: var(--accent);
        }

        .search-container {
            margin-top: 20px;
            width: 100%;
            max-width: 600px;
            display: inline-block;
        }

        #searchBar {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.2rem;
            border-radius: 30px;
            border: 2px solid #3f3f46;
            background-color: var(--bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.3s;
        }

        #searchBar:focus {
            border-color: var(--accent);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 1400px;
            margin-top: 40px;
        }

        /* Snake Game Container */
        #active-game-zone {
            background: var(--surface);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 50px;
            text-align: center;
            border: 1px solid #3f3f46;
        }

        .score-board {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--accent);
        }

        canvas {
            background-color: #000;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
        }

        /* Massive Grid */
        .library-header {
            width: 100%;
            text-align: left;
            font-size: 2rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #3f3f46;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            margin-bottom: 50px;
        }

        .game-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #3f3f46;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-5px);
            background: var(--surface-hover);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .game-title {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .game-status {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mega-Million <span>Games Hub</span></h1>
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Search 10,000+ games...">
        </div>
    </header>

    <div class="main-content">
        <!-- Playable Snake Game -->
        <div id="active-game-zone">
            <div class="score-board">Snake Score: <span id="score">0</span></div>
            <canvas id="gameCanvas" width="500" height="400"></canvas>
            <p style="color: var(--text-muted); margin-top: 15px;">Use Arrow Keys to Play</p>
        </div>

        <div class="library-header">
            Database Library (<span id="gameCount">Loading...</span>)
        </div>
        
        <!-- The Grid where JS will inject thousands of games -->
        <div class="game-grid" id="gameGrid"></div>
    </div>

    <script>
        // --- SNAKE GAME LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        const gridSize = 20;
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;

        function drawSnakeGame() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            
            // Wall wrapping
            if (head.x < 0) head.x = (canvas.width / gridSize) - 1;
            if (head.x >= canvas.width / gridSize) head.x = 0;
            if (head.y < 0) head.y = (canvas.height / gridSize) - 1;
            if (head.y >= canvas.height / gridSize) head.y = 0;

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                placeFood();
            } else {
                snake.pop(); 
            }

            // Death by self-collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y && (dx !== 0 || dy !== 0)) {
                    snake = [{ x: 10, y: 10 }];
                    dx = 0; dy = 0; score = 0;
                    scoreElement.innerText = score;
                }
            }

            // Render
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ef4444'; 
            ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);

            ctx.fillStyle = '#8b5cf6'; 
            snake.forEach(part => {
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });

            setTimeout(drawSnakeGame, 100);
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / gridSize)),
                y: Math.floor(Math.random() * (canvas.height / gridSize))
            };
        }

        document.addEventListener('keydown', (e) => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
            if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
            if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
            if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
            if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
        });

        placeFood();
        drawSnakeGame();

        // --- MASSIVE GAME GENERATOR LOGIC ---
        const gameGrid = document.getElementById('gameGrid');
        const searchBar = document.getElementById('searchBar');
        const gameCountDisplay = document.getElementById('gameCount');
        
        let gamesDatabase = [];
        const emojis = ['👾', '🏎️', '⚔️', '🧩', '🃏', '🚀', '🎯', '🏀', '🎸', '🕹️'];
        const prefixes = ['Super', 'Mega', 'Ultra', 'Cyber', 'Neon', 'Retro', 'Epic', 'Quantum'];
        const suffixes = ['Quest', 'Racer', 'Strike', 'Puzzle', 'Fighter', 'Dash', 'Legends', 'Zone'];

        // Dynamically generate 10,000 games
        console.log("Booting up rendering engine...");
        for(let i = 1; i <= 10000; i++) {
            let randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            let randomName = prefixes[Math.floor(Math.random() * prefixes.length)] + ' ' + suffixes[Math.floor(Math.random() * suffixes.length)];
            
            // Hardcode the first few to look realistic
            if(i === 1) { randomName = "Snake"; randomEmoji = "🐍"; }
            if(i === 2) { randomName = "Pong"; randomEmoji = "🏓"; }
            if(i === 3) { randomName = "Breakout"; randomEmoji = "🧱"; }

            gamesDatabase.push({
                id: i,
                title: randomName + (i > 3 ? ` ${i}` : ''),
                icon: randomEmoji,
                status: i === 1 ? 'Active' : 'Offline / Loading'
            });
        }

        // Render function (only renders first 500 so the browser doesn't explode, but searches all 10,000)
        function renderGames(filterText = "") {
            gameGrid.innerHTML = "";
            let count = 0;
            
            for(let i = 0; i < gamesDatabase.length; i++) {
                if(gamesDatabase[i].title.toLowerCase().includes(filterText.toLowerCase())) {
                    if (count < 200) { // Limit DOM nodes for performance
                        const card = document.createElement('div');
                        card.className = 'game-card';
                        card.innerHTML = `
                            <div class="game-icon">${gamesDatabase[i].icon}</div>
                            <div class="game-title">${gamesDatabase[i].title}</div>
                            <div class="game-status">${gamesDatabase[i].status}</div>
                        `;
                        gameGrid.appendChild(card);
                    }
                    count++;
                }
            }
            gameCountDisplay.innerText = `${count.toLocaleString()} Games Found`;
        }

        // Live Search Listener
        searchBar.addEventListener('input', (e) => {
            renderGames(e.target.value);
        });

        // Initial Render
        renderGames();
    </script>
</body>
</html>
