<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Orion OS | Alpha version 1.0.0</title>
    <style>
        /* =========================================
           PS5 AUTHENTIC STYLESHEET
           ========================================= */
        :root {
            --bg-base: #000000;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --ps-focus: rgba(255, 255, 255, 0.2);
            --transition-smooth: 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'SF Pro Display', -apple-system, sans-serif; user-select: none; }
        body { width: 100vw; height: 100vh; background-color: var(--bg-base); color: var(--text-main); overflow: hidden; }

        /* Dynamic Game Backgrounds */
        #dynamic-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            transition: background-image 0.5s ease-in-out; z-index: 1;
            /* Gradient overlay to make text pop like PS5 */
            box-shadow: inset 0 -300px 300px -100px rgba(0,0,0,0.9), inset 0 300px 200px -200px rgba(0,0,0,0.8);
        }

        /* PS5 UI Layer */
        #ps5-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; }

        /* Top Header */
        header { display: flex; justify-content: space-between; align-items: flex-start; padding: 40px 60px; }
        .nav-tabs { display: flex; gap: 30px; font-size: 1.2rem; font-weight: 500; }
        .nav-tabs span { color: var(--text-muted); transition: var(--transition-smooth); cursor: pointer; position: relative; padding-bottom: 5px; }
        .nav-tabs span.active { color: #fff; font-weight: 700; }
        .nav-tabs span.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: #fff; }
        
        .sys-right { display: flex; gap: 20px; align-items: center; }
        .sys-icon { font-size: 1.2rem; cursor: pointer; color: var(--text-main); }
        .clock { font-weight: 500; font-size: 1.1rem; }
        .profile-img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .profile-img:hover { border-color: #fff; }

        /* Game Content Area */
        .game-content { margin-top: auto; padding: 0 80px; display: flex; flex-direction: column; gap: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .game-logo-text { font-size: 3rem; font-weight: 800; letter-spacing: 1px; }
        
        .play-btn {
            background: rgba(255,255,255,0.1); border: 2px solid #fff; color: #fff;
            padding: 15px 40px; border-radius: 30px; font-size: 1.2rem; font-weight: 600;
            width: fit-content; cursor: pointer; backdrop-filter: blur(5px);
            transition: var(--transition-smooth); display: flex; align-items: center; gap: 10px;
        }
        .play-btn:hover { background: #fff; color: #000; transform: scale(1.05); }

        /* PS5 Bottom Icon Row */
        .icon-row { display: flex; gap: 15px; padding: 30px 80px 60px 80px; overflow-x: auto; scroll-behavior: smooth; }
        .icon-row::-webkit-scrollbar { display: none; }
        
        .game-tile {
            width: 80px; height: 80px; border-radius: 15px; background: #333;
            display: flex; justify-content: center; align-items: center; font-size: 2rem;
            cursor: pointer; transition: var(--transition-smooth); border: 2px solid transparent;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); flex-shrink: 0;
        }
        .game-tile.active { width: 90px; height: 90px; border-color: #fff; transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.8); }
        .game-tile:hover:not(.active) { border-color: rgba(255,255,255,0.5); }

        /* Fullscreen Game Engine Canvas Overlay */
        #engine-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 100; display: none; flex-direction: column;
        }
        
        /* Universal PS Button / Quit Overlay */
        #ps-quit-btn {
            position: absolute; top: 20px; left: 20px; z-index: 101;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; padding: 10px 20px; border-radius: 20px; cursor: pointer;
            backdrop-filter: blur(10px); transition: 0.2s; font-weight: 600;
        }
        #ps-quit-btn:hover { background: #fff; color: #000; }

        canvas { flex-grow: 1; display: block; width: 100%; height: 100%; background: #0a0a0c; object-fit: contain; }

    </style>
</head>
<body>

    <!-- PS5 UI LAYER -->
    <div id="dynamic-bg"></div>

    <div id="ps5-ui">
        <header>
            <div class="nav-tabs">
                <span class="active">Games</span>
                <span>Media</span>
            </div>
            <div class="sys-right">
                <span class="sys-icon">🔍</span>
                <span class="sys-icon">⚙️</span>
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=phxntom&backgroundColor=111" class="profile-img" title="phxntom">
                <span class="clock" id="sys-time">00:00 AM</span>
            </div>
        </header>

        <div class="game-content">
            <div class="game-logo-text" id="game-title">Velocity City</div>
            <button class="play-btn" id="play-btn" onclick="launchGame()">▶ Play</button>
        </div>

        <div class="icon-row" id="icon-row">
            <!-- Tiles populated by JS -->
        </div>
    </div>

    <!-- IN-GAME ENGINE LAYER -->
    <div id="engine-overlay">
        <button id="ps-quit-btn" onclick="quitGame()">Press to Exit</button>
        <canvas id="game-canvas" width="1920" height="1080"></canvas>
    </div>

    <script>
        /* =========================================
           PS5 UI LOGIC
           ========================================= */
        const games = [
            { id: 'velocity', title: 'Velocity City', icon: '🏎️', bg: 'linear-gradient(to bottom, #2b1055, #7597de)' },
            { id: 'clash', title: 'Cursed Clash', icon: '⚔️', bg: 'linear-gradient(to bottom, #4a00e0, #8e2de2)' },
            { id: 'dungeon', title: 'Dungeon Legends', icon: '🛡️', bg: 'linear-gradient(to bottom, #0f2027, #203a43)' },
            { id: 'neon', title: 'Neon Runner', icon: '🏃‍♂️', bg: 'linear-gradient(to bottom, #ff00cc, #333399)' }
        ];

        let selectedGameId = games[0].id;
        const row = document.getElementById('icon-row');
        const bgLayer = document.getElementById('dynamic-bg');
        const titleText = document.getElementById('game-title');

        // Build PS5 Row
        games.forEach((game, index) => {
            const tile = document.createElement('div');
            tile.className = index === 0 ? 'game-tile active' : 'game-tile';
            tile.innerHTML = game.icon;
            
            tile.addEventListener('click', () => {
                document.querySelectorAll('.game-tile').forEach(t => t.classList.remove('active'));
                tile.classList.add('active');
                selectedGameId = game.id;
                titleText.innerText = game.title;
                bgLayer.style.background = game.bg;
            });
            row.appendChild(tile);
        });

        // Init First Game bg
        bgLayer.style.background = games[0].bg;

        // Clock
        setInterval(() => {
            const d = new Date();
            let h = d.getHours(); let m = d.getMinutes(); let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12; m = m < 10 ? '0'+m : m;
            document.getElementById('sys-time').innerText = h + ':' + m + ' ' + ampm;
        }, 1000);

        /* =========================================
           MASTER CANVAS GAME ENGINE
           ========================================= */
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let gameLoopId;
        let activeEngine = null;

        function launchGame() {
            document.getElementById('ps5-ui').style.display = 'none';
            document.getElementById('engine-overlay').style.display = 'flex';
            
            // Clear existing keys
            window.onkeydown = null; window.onkeyup = null; canvas.onmousedown = null;

            if(selectedGameId === 'velocity') initVelocityCity();
            if(selectedGameId === 'clash') initCursedClash();
            if(selectedGameId === 'dungeon') initDungeonLegends();
            if(selectedGameId === 'neon') initNeonRunner();
        }

        function quitGame() {
            cancelAnimationFrame(gameLoopId);
            activeEngine = null;
            document.getElementById('engine-overlay').style.display = 'none';
            document.getElementById('ps5-ui').style.display = 'flex';
        }

        /* -----------------------------------------
           GAME 1: VELOCITY CITY (FULLY WORKING)
           ----------------------------------------- */
        let vcKeys = { w: false };
        let vcState = { speed: 0, lines: [], crashed: false, won: false };
        
        function initVelocityCity() {
            activeEngine = 'velocity';
            vcState = { speed: 0, lines: [], crashed: false, won: false };
            for(let i=0; i<40; i++) vcState.lines.push({ y: Math.random()*canvas.height, x: Math.random()*canvas.width, z: Math.random()*2+1 });
            
            window.onkeydown = (e) => { if(e.key === 'w' || e.key === 'ArrowUp') vcKeys.w = true; }
            window.onkeyup = (e) => { if(e.key === 'w' || e.key === 'ArrowUp') vcKeys.w = false; }
            velocityLoop();
        }

        function velocityLoop() {
            if(activeEngine !== 'velocity') return;
            
            if(!vcState.crashed && !vcState.won) {
                if(vcKeys.w) vcState.speed += 0.8 + (vcState.speed * 0.005);
                else vcState.speed *= 0.97;
                
                if(vcState.speed > 999) vcState.won = true;
                if(vcState.speed > 700 && Math.random() < 0.002) vcState.crashed = true; // Blow engine logic
            }

            ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw Warp Lines
            ctx.fillStyle = vcState.speed > 800 ? '#ff003c' : (vcState.speed > 500 ? '#00e5ff' : '#ffffff');
            vcState.lines.forEach(line => {
                line.y += (vcState.speed / line.z) + 2;
                if(line.y > canvas.height) { line.y = -50; line.x = Math.random()*canvas.width; }
                let length = 30 * (vcState.speed/100 + 1);
                ctx.fillRect(line.x, line.y, 4, length);
            });

            // UI
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
            ctx.font = 'bold 100px Arial'; ctx.fillText(Math.floor(vcState.speed) + ' MPH', canvas.width/2, canvas.height - 150);
            ctx.font = '30px Arial'; ctx.fillText('Hold W or UP to accelerate. Push it to 999.', canvas.width/2, canvas.height - 80);

            if(vcState.crashed) { ctx.fillStyle = 'red'; ctx.font = 'bold 150px Arial'; ctx.fillText('ENGINE BLOWN', canvas.width/2, canvas.height/2); }
            if(vcState.won) { ctx.fillStyle = 'gold'; ctx.font = 'bold 150px Arial'; ctx.fillText('999 MPH - YOU SURVIVED', canvas.width/2, canvas.height/2); }
            
            gameLoopId = requestAnimationFrame(velocityLoop);
        }

        /* -----------------------------------------
           GAME 2: CURSED CLASH (FULLY WORKING)
           ----------------------------------------- */
        let ccKeys = {};
        let ccState = {};

        function initCursedClash() {
            activeEngine = 'clash';
            ccState = { 
                p1: { x: 300, y: 700, w: 80, h: 150, color: '#00e5ff', hp: 100, attacking: false },
                p2: { x: 1500, y: 700, w: 80, h: 150, color: '#ff0055', hp: 100, attacking: false }
            };
            window.onkeydown = (e) => ccKeys[e.key] = true;
            window.onkeyup = (e) => ccKeys[e.key] = false;
            clashLoop();
        }

        function clashLoop() {
            if(activeEngine !== 'clash') return;

            // Movement
            if(ccKeys['a']) ccState.p1.x -= 12;
            if(ccKeys['d']) ccState.p1.x += 12;
            if(ccKeys['ArrowLeft']) ccState.p2.x -= 12;
            if(ccKeys['ArrowRight']) ccState.p2.x += 12;

            // Combat (P1 Space, P2 Enter)
            if(ccKeys[' '] && !ccState.p1.attacking) {
                ccState.p1.attacking = true;
                if(Math.abs(ccState.p1.x - ccState.p2.x) < 220) ccState.p2.hp -= 8;
                setTimeout(() => ccState.p1.attacking = false, 250);
            }
            if(ccKeys['Enter'] && !ccState.p2.attacking) {
                ccState.p2.attacking = true;
                if(Math.abs(ccState.p2.x - ccState.p1.x) < 220) ccState.p1.hp -= 8;
                setTimeout(() => ccState.p2.attacking = false, 250);
            }

            // Draw Env
            ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#222'; ctx.fillRect(0, 850, canvas.width, 300); // Floor

            // Draw Players
            ctx.fillStyle = ccState.p1.color; ctx.fillRect(ccState.p1.x, ccState.p1.y, ccState.p1.w, ccState.p1.h);
            ctx.fillStyle = ccState.p2.color; ctx.fillRect(ccState.p2.x, ccState.p2.y, ccState.p2.w, ccState.p2.h);

            // Draw Attacks
            if(ccState.p1.attacking) { ctx.fillStyle = '#fff'; ctx.fillRect(ccState.p1.x + ccState.p1.w, ccState.p1.y + 40, 150, 40); }
            if(ccState.p2.attacking) { ctx.fillStyle = '#fff'; ctx.fillRect(ccState.p2.x - 150, ccState.p2.y + 40, 150, 40); }

            // Draw UI
            ctx.fillStyle = '#333'; ctx.fillRect(100, 100, 600, 30); ctx.fillRect(1220, 100, 600, 30);
            ctx.fillStyle = '#00e5ff'; ctx.fillRect(100, 100, Math.max(0, ccState.p1.hp) * 6, 30);
            ctx.fillStyle = '#ff0055'; ctx.fillRect(1220 + (600 - Math.max(0, ccState.p2.hp)*6), 100, Math.max(0, ccState.p2.hp) * 6, 30);
            
            ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.textAlign = 'left'; ctx.fillText('P1: WASD + SPACE', 100, 160);
            ctx.textAlign = 'right'; ctx.fillText('P2: ARROWS + ENTER', 1820, 160);

            if(ccState.p1.hp <= 0 || ccState.p2.hp <= 0) {
                ctx.fillStyle = 'gold'; ctx.font = 'bold 100px Arial'; ctx.textAlign = 'center';
                ctx.fillText(ccState.p1.hp <= 0 ? 'PLAYER 2 WINS' : 'PLAYER 1 WINS', canvas.width/2, canvas.height/2);
            } else {
                gameLoopId = requestAnimationFrame(clashLoop);
            }
        }

        /* -----------------------------------------
           GAME 3: DUNGEON LEGENDS (FULLY WORKING)
           ----------------------------------------- */
        let dlState = {};
        let dlKeys = {};

        function initDungeonLegends() {
            activeEngine = 'dungeon';
            dlState = {
                player: { x: canvas.width/2, y: canvas.height/2, size: 40, color: '#00ccff', speed: 8 },
                bullets: [], enemies: [], frame: 0, score: 0, dead: false
            };
            window.onkeydown = (e) => dlKeys[e.key.toLowerCase()] = true;
            window.onkeyup = (e) => dlKeys[e.key.toLowerCase()] = false;
            
            canvas.onmousedown = (e) => {
                if(dlState.dead) return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clickX = (e.clientX - rect.left) * scaleX;
                const clickY = (e.clientY - rect.top) * scaleY;
                
                const angle = Math.atan2(clickY - dlState.player.y, clickX - dlState.player.x);
                dlState.bullets.push({ x: dlState.player.x, y: dlState.player.y, vx: Math.cos(angle)*15, vy: Math.sin(angle)*15 });
            };
            dungeonLoop();
        }

        function dungeonLoop() {
            if(activeEngine !== 'dungeon') return;
            dlState.frame++;
            
            // Movement
            if(!dlState.dead) {
                if(dlKeys['w']) dlState.player.y -= dlState.player.speed;
                if(dlKeys['s']) dlState.player.y += dlState.player.speed;
                if(dlKeys['a']) dlState.player.x -= dlState.player.speed;
                if(dlKeys['d']) dlState.player.x += dlState.player.speed;
            }

            // Spawn Enemies
            if(dlState.frame % 60 === 0 && !dlState.dead) {
                dlState.enemies.push({
                    x: Math.random() < 0.5 ? 0 : canvas.width,
                    y: Math.random() * canvas.height,
                    size: 30, speed: 3 + (dlState.score * 0.1)
                });
            }

            ctx.fillStyle = '#222'; ctx.fillRect(0, 0, canvas.width, canvas.height); // BG

            // Update & Draw Bullets
            ctx.fillStyle = 'yellow';
            for(let i = dlState.bullets.length - 1; i >= 0; i--) {
                let b = dlState.bullets[i];
                b.x += b.vx; b.y += b.vy;
                ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
            }

            // Update & Draw Enemies
            ctx.fillStyle = 'red';
            for(let i = dlState.enemies.length - 1; i >= 0; i--) {
                let e = dlState.enemies[i];
                if(!dlState.dead) {
                    const angle = Math.atan2(dlState.player.y - e.y, dlState.player.x - e.x);
                    e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed;
                    
                    // Collision with player
                    let dist = Math.hypot(dlState.player.x - e.x, dlState.player.y - e.y);
                    if(dist < e.size + dlState.player.size) dlState.dead = true;
                }
                ctx.fillRect(e.x - e.size, e.y - e.size, e.size*2, e.size*2);

                // Collision with bullets
                for(let j = dlState.bullets.length - 1; j >= 0; j--) {
                    let b = dlState.bullets[j];
                    if(Math.hypot(b.x - e.x, b.y - e.y) < e.size + 8) {
                        dlState.enemies.splice(i, 1);
                        dlState.bullets.splice(j, 1);
                        dlState.score++;
                        break;
                    }
                }
            }

            // Draw Player
            if(!dlState.dead) {
                ctx.fillStyle = dlState.player.color;
                ctx.beginPath(); ctx.arc(dlState.player.x, dlState.player.y, dlState.player.size, 0, Math.PI*2); ctx.fill();
            }

            // Draw UI
            ctx.fillStyle = '#fff'; ctx.font = '40px Arial'; ctx.textAlign = 'left';
            ctx.fillText('Score: ' + dlState.score, 30, 60);
            ctx.font = '24px Arial'; ctx.fillText('WASD to Move | Click to Shoot', 30, 100);

            if(dlState.dead) {
                ctx.fillStyle = 'red'; ctx.font = 'bold 100px Arial'; ctx.textAlign = 'center';
                ctx.fillText('YOU DIED', canvas.width/2, canvas.height/2);
            }

            gameLoopId = requestAnimationFrame(dungeonLoop);
        }

        /* -----------------------------------------
           GAME 4: NEON RUNNER (FULLY WORKING)
           ----------------------------------------- */
        let nrState = {};
        
        function initNeonRunner() {
            activeEngine = 'neon';
            nrState = {
                player: { y: 800, vy: 0, jumping: false },
                blocks: [], score: 0, dead: false
            };
            window.onkeydown = (e) => {
                if(e.code === 'Space' && !nrState.player.jumping && !nrState.dead) {
                    nrState.player.vy = -25;
                    nrState.player.jumping = true;
                }
            };
            neonLoop();
        }

        function neonLoop() {
            if(activeEngine !== 'neon') return;

            // Physics
            if(!nrState.dead) {
                nrState.player.vy += 1.2; // gravity
                nrState.player.y += nrState.player.vy;
                if(nrState.player.y > 800) { nrState.player.y = 800; nrState.player.jumping = false; }
                
                // Spawn blocks
                if(Math.random() < 0.015) {
                    nrState.blocks.push({ x: canvas.width, w: 50, h: 100 + Math.random()*50 });
                }
                nrState.score++;
            }

            // Draw Env
            ctx.fillStyle = '#0a0a2a'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Sky
            ctx.fillStyle = '#ff00cc'; ctx.fillRect(0, 880, canvas.width, 200); // Floor

            // Draw Player
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(200, nrState.player.y, 80, 80);

            // Draw Blocks
            ctx.fillStyle = '#fff';
            for(let i = nrState.blocks.length - 1; i >= 0; i--) {
                let b = nrState.blocks[i];
                if(!nrState.dead) b.x -= 15 + (nrState.score * 0.002);
                ctx.fillRect(b.x, 880 - b.h, b.w, b.h);

                // Hitbox detection
                if(200 < b.x + b.w && 280 > b.x && nrState.player.y + 80 > 880 - b.h) {
                    nrState.dead = true;
                }
            }

            // UI
            ctx.fillStyle = '#fff'; ctx.font = '40px Arial'; ctx.textAlign = 'left';
            ctx.fillText('Score: ' + Math.floor(nrState.score/10), 30, 60);
            ctx.font = '24px Arial'; ctx.fillText('Press SPACE to Jump', 30, 100);

            if(nrState.dead) {
                ctx.fillStyle = 'red'; ctx.font = 'bold 100px Arial'; ctx.textAlign = 'center';
                ctx.fillText('CRASHED', canvas.width/2, canvas.height/2);
            }

            gameLoopId = requestAnimationFrame(neonLoop);
        }

    </script>
</body>
</html>
