<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beginnings of Agriculture Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px 12px;background:#f1f7f3;color:#183429;font:16px/1.5 system-ui,sans-serif}main{max-width:680px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 8px 30px #153a271c}h1{margin:0;color:#176039;font-size:1.45rem}h2{font-size:1.15rem;margin:20px 0 14px}.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#4e6b5a;font-size:.88rem;margin:10px 0}progress{width:100%;height:9px;accent-color:#27975e}.answers{display:grid;gap:8px}button{font:inherit;cursor:pointer}.answers button{text-align:left;padding:11px 14px;border:1px solid #d0e2d6;border-radius:10px;background:#f8fcf9;color:#183429}.answers button:hover:enabled{background:#e9f6ec}.answers button:disabled{cursor:default}.answers .right{border-color:#258149;background:#e4f6e9}.answers .wrong{border-color:#bd5661;background:#fff1f2}.action{margin-top:14px;padding:10px 16px;border:0;border-radius:9px;background:#197444;color:white;font-weight:600}textarea{width:100%;min-height:90px;padding:10px;border:1px solid #b6cdbd;border-radius:9px;font:inherit}#feedback{margin-top:14px}#feedback p{margin:5px 0}.small{font-size:.9rem;color:#4e6b5a}li{margin-bottom:12px}@media(max-width:420px){main{padding:18px}}
</style>
</head>
<body>
<main>
  <h1>🌱 Beginnings of Agriculture</h1>
  <div class="meta"><span id="position"></span><span id="score"></span></div>
  <progress id="progress" max="13" value="0" aria-label="Quiz progress"></progress>
  <section id="card" aria-live="polite"></section>
</main>
<script>
const quiz = [
  {q:'What does “Neolithic” mean?',a:['Old Stone Age','New Stone Age','Bronze Age','First Farming Town'],c:1,e:'Neolithic means New Stone Age.'},
  {q:'What did people do to stones to make tools like saws and drills?',a:['Melted them','Turned them into metal','Polished them','Painted them'],c:2,e:'People polished stones to make useful tools.'},
  {q:'What is domestication?',a:['Changing plants or animals to make them more useful to humans','Moving from place to place to hunt','Building monuments from huge stones','Making tools from metal'],c:0,e:'Domestication is changing plants or animals to make them more useful to people.'},
  {q:'What is agriculture?',a:['Hunting wild animals','Gathering wild plants','Making stone tools','Growing plants and raising animals'],c:3,e:'Agriculture means farming: growing plants and raising animals.'},
  {q:'Which three animals does your guide mention early farmers could keep?',a:['Lions, tigers, and bears','Sheep, goats, and cattle','Sharks, whales, and dolphins','Wolves, eagles, and foxes'],c:1,e:'Your guide names sheep, goats, and cattle.'},
  {q:'What could farmers get from sheep and goats?',a:['Stone and metal','Wood and fire','Milk, food, and wool','Seeds and soil'],c:2,e:'Sheep and goats could provide milk, food, and wool.'},
  {q:'How could large animals like cattle help farmers?',a:['By carrying loads and pulling farm tools','By polishing stone tools','By building megaliths without people','By gathering wild berries'],c:0,e:'Cattle could carry loads and pull heavy farming tools.'},
  {q:'How did farming change the way many people lived?',a:['It made everyone stop using tools.','It forced everyone to move every day.','It caused people to stop eating plants.','It helped people settle in communities and grow towns.'],c:3,e:'Farming helped people settle in communities that could grow into towns.'},
  {q:'What were megaliths?',a:['Small tools used for farming','Animals raised for food','Huge stones used as monuments or religious gathering sites','Houses made entirely of wood'],c:2,e:'Megaliths were huge stones used as monuments or places for religious gatherings.'},
  {q:'According to your guide, what began to happen around the end of the Neolithic Era, about 5,000 years ago?',a:['People stopped growing crops.','People began making tools out of metal.','People first began gathering wild plants.','People stopped living in communities.'],c:1,e:'Your guide says people began making metal tools as the Neolithic ended. The timing varied by region.'},
  {q:'How was life in the Neolithic different from earlier eras such as the Paleolithic and Mesolithic?',sample:'Earlier people generally relied on hunting and gathering. During the Neolithic, people began farming and domesticating plants and animals. Many settled in communities and made polished stone tools.'},
  {q:'Why was domestication important to early people? Give at least one benefit.',sample:'Domestication made plants and animals more useful to people. For example, sheep and goats could provide food, milk, and wool; cattle could carry loads and pull tools.'},
  {q:'What were megaliths used for, and what might they tell us about early religion?',sample:'Megaliths were huge stones used as monuments or religious gathering sites. They suggest some communities gathered for religious purposes, though their exact beliefs are uncertain.'}
];
let index=0, correct=0, answered=0, missed=[];
const card=document.getElementById('card'), position=document.getElementById('position'), score=document.getElementById('score'), progress=document.getElementById('progress');
function make(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function show(){
  card.replaceChildren();
  progress.value=index;
  score.textContent=`${correct} / ${answered} multiple choice correct`;
  if(index===quiz.length){
    position.textContent='Quiz complete';
    card.append(make('h2',`${correct} out of ${answered} multiple-choice questions correct`),make('p','You also practiced three short-answer questions. They are not included in your score.'));
    if(missed.length){card.append(make('strong','Review these:'));const list=make('ul');missed.forEach(item=>{const li=make('li');li.append(make('strong',item.q),make('div',item.e));list.append(li)});card.append(list)}else card.append(make('p','Nice work—you got every multiple-choice question!'));
    const restart=make('button','Try again','action');restart.type='button';restart.onclick=()=>{index=correct=answered=0;missed=[];show()};card.append(restart);return;
  }
  const item=quiz[index];position.textContent=`Question ${index+1} of ${quiz.length}`;card.append(make('h2',item.q));
  const feedback=make('div');feedback.id='feedback';feedback.setAttribute('aria-live','polite');
  const next=make('button',index===quiz.length-1?'See results':'Next question','action');next.type='button';next.hidden=true;next.onclick=()=>{index++;show()};
  if(item.a){
    const choices=make('div',undefined,'answers');
    item.a.forEach((answer,n)=>{const b=make('button',`${String.fromCharCode(65+n)}. ${answer}`);b.type='button';b.onclick=()=>{answered++;const yes=n===item.c;if(yes)correct++;else missed.push(item);score.textContent=`${correct} / ${answered} multiple choice correct`;Array.from(choices.children).forEach((choice,j)=>{choice.disabled=true;if(j===item.c)choice.className='right';else if(j===n)choice.className='wrong'});feedback.replaceChildren(make('strong',yes?'You got it!':`Not quite. The answer is ${String.fromCharCode(65+item.c)}. ${item.a[item.c]}`),make('p',item.e));next.hidden=false};choices.append(b)});
    card.append(choices);
  }else{
    const label=make('label','Practice answer (optional)','small');label.htmlFor='response';const input=make('textarea');input.id='response';input.placeholder='Type here, or think of your answer before revealing the example.';
    const reveal=make('button','Show example answer','action');reveal.type='button';reveal.onclick=()=>{feedback.replaceChildren(make('strong','Example answer'),make('p',item.sample),make('p','Compare it with your answer. This practice is not included in your score.','small'));reveal.hidden=true;next.hidden=false};card.append(label,input,reveal);
  }
  card.append(feedback,next);
}
show();
</script>
</body>
</html>
