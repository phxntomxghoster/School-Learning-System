<div id="view-chat" class="view-section">

<div class="chat-container">

    <div class="channels">

        <h3>PHANTOM HUB</h3>

        <button onclick="switchChannel('general')">
        # general
        </button>

        <button onclick="switchChannel('gaming')">
        # gaming
        </button>

        <button onclick="switchChannel('coding')">
        # coding
        </button>

        <button onclick="switchChannel('homework')">
        # homework
        </button>

        <button onclick="switchChannel('ideas')">
        # ideas
        </button>

    </div>



    <div class="chat-main">

        <h2 id="channel-title">
        # general
        </h2>


        <div id="messages">

        </div>


        <div class="message-box">

        <input 
        id="message-input"
        placeholder="Message #general..."
        onkeydown="if(event.key==='Enter')sendMessage()">


        <button onclick="sendMessage()">
        SEND
        </button>


        </div>


    </div>


</div>

</div>
